# /etc/chrony/chrony.conf
# NTP server backed by HTTPS time sync.
#
# No upstream NTP peers are configured. The system clock is
# disciplined externally by htpdate via HTTPS Date headers (see
# entrypoint.sh); chrony only *serves* that clock to LAN clients.
# chrony must never adjust the clock itself — htpdate owns both
# offset corrections and the kernel frequency.

# Serve the local system clock at stratum 3.
# Deliberately NOT "orphan": orphan mode only activates the local
# reference after comparing against other NTP sources, and with zero
# sources configured it never activates — chrony would answer every
# client with stratum 0 (unsynchronized) forever.
local stratum 3

# Allow NTP clients from anywhere.
# Restrict access via Docker network or firewall as needed.
allow all

# Listen on all interfaces.
port 123
bindaddress 0.0.0.0

# NOTE: no "driftfile" on purpose. With no NTP sources chrony can never
# measure drift, so its driftfile only ever holds 0.0 ppm — and on every
# startup chrony would apply that 0.0 to the kernel clock, wiping the
# frequency correction htpdate just restored from its own drift file.
#
# NOTE: no "makestep" either — with no sources chrony never steps the
# clock; htpdate (-s) performs the initial step instead.

# Logging
logdir /var/log/chrony
log tracking measurements statistics
